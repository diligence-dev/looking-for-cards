<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Looking for Cards</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                background: #1a1a2e;
                color: #eee;
                min-height: 100vh;
                padding: 20px;
            }

            .hidden {
                display: none !important;
            }

            /* Screen A */
            #screen-a {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 80vh;
            }

            .name-card {
                background: #16213e;
                border-radius: 12px;
                padding: 40px;
                max-width: 360px;
                width: 100%;
                text-align: center;
            }

            .name-card h1 {
                margin-bottom: 8px;
                color: #e94560;
            }

            .name-card p {
                color: #888;
                margin-bottom: 20px;
            }

            .name-card input {
                width: 100%;
                padding: 12px 16px;
                font-size: 16px;
                border: 2px solid #333;
                border-radius: 8px;
                background: #1a1a2e;
                color: #eee;
                margin-bottom: 16px;
            }

            .name-card input:focus {
                outline: none;
                border-color: #e94560;
            }

            .name-card button {
                width: 100%;
                padding: 12px;
                font-size: 16px;
                background: #e94560;
                color: white;
                border: none;
                border-radius: 8px;
                cursor: pointer;
            }

            .name-card button:disabled {
                background: #555;
                cursor: not-allowed;
            }

            /* Top bar */
            .topbar {
                position: sticky;
                top: 0;
                background: #1a1a2e;
                padding: 12px 0;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
                margin-bottom: 20px;
                z-index: 10;
            }

            .topbar button,
            .topbar input,
            .topbar label,
            .topbar select {
                padding: 8px 14px;
                font-size: 14px;
                border: 2px solid #333;
                border-radius: 8px;
                background: #16213e;
                color: #eee;
            }

            .topbar button {
                background: #e94560;
                border: none;
                cursor: pointer;
            }

            .topbar button:hover {
                background: #ff6b6b;
            }

            .topbar select {
                cursor: pointer;
            }

            .topbar input[type="search"] {
                min-width: 140px;
            }

            .topbar input[type="search"]:focus {
                outline: none;
                border-color: #e94560;
            }

            .topbar label {
                display: flex;
                align-items: center;
                gap: 6px;
                cursor: pointer;
                font-size: 13px;
            }

            /* Multiselect (giver / seeker name filters) */
            .multiselect {
                position: relative;
                display: inline-block;
            }

            .topbar .ms-trigger {
                padding: 8px 14px;
                font-size: 14px;
                border: 2px solid #333;
                border-radius: 8px;
                background: #16213e;
                color: #eee;
                cursor: pointer;
                white-space: nowrap;
            }

            .topbar .ms-trigger:hover,
            .topbar .ms-trigger.open {
                border-color: #e94560;
            }

            .ms-panel {
                position: absolute;
                top: calc(100% + 4px);
                left: 0;
                background: #16213e;
                border: 2px solid #333;
                border-radius: 8px;
                padding: 6px;
                max-height: 240px;
                overflow-y: auto;
                min-width: 100%;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
                z-index: 20;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .ms-panel.empty {
                padding: 10px 12px;
                color: #888;
                font-size: 13px;
            }

            .topbar .ms-panel label {
                display: flex;
                align-items: center;
                gap: 6px;
                cursor: pointer;
                font-size: 13px;
                padding: 4px 6px;
                border-radius: 4px;
                white-space: nowrap;
            }

            .topbar .ms-panel label:hover {
                background: #1a2540;
            }

            .ms-panel input[type="checkbox"] {
                accent-color: #e94560;
                cursor: pointer;
            }

            /* Sort control (far right, arrow reorder) */
            #sort-control .ms-panel {
                left: auto;
                right: 0;
                min-width: 220px;
            }

            .sort-list {
                list-style: none;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .sort-item {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 4px 6px;
                border: 1px solid #333;
                border-radius: 6px;
                background: #1a1a2e;
                font-size: 13px;
                white-space: nowrap;
            }

            .sort-item span.sort-label {
                flex: 1;
            }

            .sort-item button.sort-move {
                flex: none;
                width: 28px;
                height: 28px;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #2a3450;
                color: #eee;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 13px;
            }

            .sort-item button.sort-move:hover:not(:disabled) {
                background: #3a4470;
            }

            .sort-item button.sort-move:disabled {
                opacity: 0.35;
                cursor: default;
            }

            /* Grid */
            .card-grid {
                --card-min: 200px;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
                gap: 2px;
                margin-bottom: 40px;
                /* Let the browser handle vertical scroll, we handle pinch. */
                touch-action: pan-y;
            }

            .card-grid.fixed-cols {
                grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
            }

            .card-tile {
                background: #16213e;
                border: 1px solid #2a3450;
                border-radius: 12px;
                overflow: hidden;
                position: relative;
                display: flex;
                flex-direction: column;
            }

            .card-tile.claimed {
                opacity: 0.7;
            }

            .img-wrap {
                position: relative;
                background: #0f1629;
                flex: none;
            }

            .img-wrap img {
                width: 100%;
                height: auto;
                display: block;
                /* Scryfall JPGs bake white outside the card corner: mask with card-like radius. */
                border-radius: 5%;
                background: #0f1629;
            }

            .card-tile.clickable .img-wrap {
                cursor: pointer;
            }

            .card-tile.clickable .img-wrap:hover img {
                filter: brightness(1.1);
            }

            .claimed-badge {
                position: absolute;
                top: 8px;
                right: 8px;
                background: #e94560;
                color: white;
                font-size: 11px;
                padding: 3px 8px;
                border-radius: 4px;
            }

            .card-tile .info {
                background: #0f1629;
                flex: 1;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 10px 10px;
            }

            .card-tile .info.has-giver {
                border: 6px solid #22c55e;
            }

            .card-tile .info-text {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 2px;
            }

            .card-tile .tile-icon-btn {
                flex: none;
                width: 28px;
                height: 28px;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #2a3450;
                color: #eee;
                border: none;
                border-radius: 6px;
                cursor: pointer;
            }

            .card-tile .tile-icon-btn:hover {
                background: #3a4470;
            }

            .card-tile .tile-icon-btn svg {
                width: 16px;
                height: 16px;
                display: block;
            }

            .card-tile .seeker {
                font-size: 12px;
                color: #aaa;
            }

            .card-tile .giver {
                font-size: 12px;
                color: #22c55e;
                font-weight: bold;
            }

            .card-tile .actions {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                padding-top: 6px;
            }

            .card-tile .actions button {
                flex: 1;
                padding: 6px 8px;
                font-size: 12px;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                background: #2a3450;
                color: #eee;
            }

            .card-tile .actions button:hover {
                background: #3a4470;
            }

            .card-tile .note {
                display: block;
                width: fit-content;
                max-width: calc(100% - 12px);
                margin: 6px auto;
                align-self: center;
                font-size: 12px;
                font-weight: 700;
                color: white;
                background: #e94560;
                padding: 4px 12px;
                border-radius: 999px;
                text-align: center;
                line-height: 1.2;
                overflow-wrap: anywhere;
            }

            /* Add section (inside modal) */
            .add-section h2 {
                margin-bottom: 10px;
                padding-right: 40px;
            }

            .add-section h3 {
                margin: 16px 0 10px;
                font-size: 16px;
            }

            .add-section .hint {
                margin-bottom: 10px;
                color: #888;
                font-size: 13px;
            }

            .add-section textarea {
                width: 100%;
                min-height: 120px;
                padding: 12px;
                font-size: 14px;
                font-family: inherit;
                border: 2px solid #333;
                border-radius: 8px;
                background: #16213e;
                color: #eee;
                resize: vertical;
            }

            .add-section textarea:focus {
                outline: none;
                border-color: #e94560;
            }

            .add-section #card-note {
                width: 100%;
                margin-top: 10px;
                padding: 10px 12px;
                font-size: 14px;
                font-family: inherit;
                border: 2px solid #333;
                border-radius: 8px;
                background: #16213e;
                color: #eee;
            }

            .add-section #card-note:focus {
                outline: none;
                border-color: #e94560;
            }

            #note-counter {
                margin-top: 4px;
                font-size: 12px;
                color: #888;
                text-align: right;
            }

            .add-section button {
                margin-top: 10px;
                padding: 10px 24px;
                font-size: 14px;
                background: #e94560;
                color: white;
                border: none;
                border-radius: 8px;
                cursor: pointer;
            }

            .add-section button:disabled {
                background: #555;
                cursor: not-allowed;
            }

            #add-progress {
                margin-top: 10px;
                color: #888;
                font-size: 13px;
            }

            #add-results {
                margin-top: 10px;
                font-size: 13px;
                line-height: 1.5;
            }

            #add-results .err {
                color: #ff6b6b;
            }

            /* Modal */
            .modal {
                position: fixed;
                inset: 0;
                z-index: 50;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .modal-backdrop {
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.6);
            }

            .modal-card {
                position: relative;
                background: #16213e;
                border-radius: 12px;
                padding: 24px;
                max-width: 600px;
                width: 100%;
                max-height: 90vh;
                overflow-y: auto;
            }

            .modal-close {
                position: absolute;
                top: 8px;
                right: 8px;
                width: 32px;
                height: 32px;
                background: transparent;
                color: #eee;
                border: none;
                font-size: 24px;
                line-height: 1;
                cursor: pointer;
            }

            .modal-close:hover {
                color: #e94560;
            }

            /* Occasion picker (shared by My occasions + add-cards modals) */
            .occ-list {
                display: flex;
                flex-direction: column;
                gap: 4px;
                margin-bottom: 10px;
                max-height: 200px;
                overflow-y: auto;
            }

            .occ-list label {
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                font-size: 13px;
                padding: 4px 6px;
                border-radius: 4px;
            }

            .occ-list label:hover {
                background: #1a2540;
            }

            .occ-list input[type="checkbox"] {
                accent-color: #e94560;
                cursor: pointer;
            }

            .add-section .occ-new-toggle {
                background: #2a3450;
                margin-top: 0;
                padding: 8px 14px;
            }

            .add-section .occ-new-toggle:hover {
                background: #3a4470;
            }

            .occ-new-form {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                margin: 8px 0 12px;
            }

            .occ-new-form input[type="text"],
            .occ-new-form input[type="date"] {
                padding: 8px 10px;
                font-size: 13px;
                border: 2px solid #333;
                border-radius: 8px;
                background: #1a1a2e;
                color: #eee;
            }

            .occ-new-form input:focus {
                outline: none;
                border-color: #e94560;
            }

            .occ-new-form label {
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: 13px;
                cursor: pointer;
            }

            .occ-new-form .occ-create {
                margin-top: 0;
                padding: 8px 14px;
            }

            /* Screen A occasion confirmation */
            #occasion-confirm {
                margin-top: 16px;
                text-align: left;
            }

            #occasion-confirm p {
                margin-bottom: 8px;
            }

            #occasion-confirm-list {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            #occasion-confirm-list label {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 14px;
                cursor: pointer;
                color: #eee;
            }

            #occasion-confirm-list input[type="checkbox"] {
                accent-color: #e94560;
                cursor: pointer;
            }

            /* Toast */
            .toast {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                background: #e94560;
                color: white;
                padding: 12px 20px;
                border-radius: 8px;
                font-size: 14px;
                z-index: 100;
                max-width: 90vw;
            }

            @media (max-width: 768px) {
                .topbar {
                    flex-direction: column;
                    align-items: stretch;
                }

                .topbar input[type="search"] {
                    min-width: 0;
                }

                .multiselect {
                    width: 100%;
                }

                .ms-trigger {
                    width: 100%;
                    text-align: left;
                }
            }
        </style>
    </head>
    <body>
        <div id="screen-a" class="screen">
            <div class="name-card">
                <h1>Looking for Cards</h1>
                <p>What's your name?</p>
                <input id="name-input" type="text" placeholder="Your name" autocomplete="off" />
                <button id="continue-btn" disabled>Continue</button>
                <div id="occasion-confirm" class="hidden">
                    <p>Are you going to these occasions?</p>
                    <div id="occasion-confirm-list"></div>
                </div>
            </div>
        </div>

        <div id="screen-b" class="screen hidden">
            <div class="topbar">
                <button id="seek-btn">I'm seeking...</button>
                <button id="my-occasions-btn">My occasions</button>
                <div class="multiselect" id="occasion-filter">
                    <button class="ms-trigger" type="button">all occasions</button>
                    <div class="ms-panel hidden"></div>
                </div>
                <input id="card-filter" type="search" placeholder="card name" />
                <select id="color-filter">
                    <option value="">all colors</option>
                    <option value="W">White</option>
                    <option value="U">Blue</option>
                    <option value="B">Black</option>
                    <option value="R">Red</option>
                    <option value="G">Green</option>
                    <option value="colorless">Colorless</option>
                    <option value="multicolor">Multicolor</option>
                </select>
                <select id="type-filter">
                    <option value="">all types</option>
                    <option value="0">Planeswalker</option>
                    <option value="1">Creature</option>
                    <option value="2">Artifact</option>
                    <option value="3">Enchantment</option>
                    <option value="4">Instant</option>
                    <option value="5">Sorcery</option>
                    <option value="6">Land</option>
                    <option value="7">Battle</option>
                    <option value="8">Other</option>
                </select>
                <div class="multiselect" id="seeker-filter">
                    <button class="ms-trigger" type="button">all seekers</button>
                    <div class="ms-panel hidden"></div>
                </div>
                <div class="multiselect" id="giver-filter">
                    <button class="ms-trigger" type="button">all givers</button>
                    <div class="ms-panel hidden"></div>
                </div>
                <label><input id="hide-giver" type="checkbox" /> Hide giver found</label>
                <select id="cards-per-row">
                    <option value="auto">auto</option>
                    <option value="2">2 per row</option>
                    <option value="3">3 per row</option>
                    <option value="4">4 per row</option>
                    <option value="5">5 per row</option>
                    <option value="6">6 per row</option>
                    <option value="7">7 per row</option>
                    <option value="8">8 per row</option>
                    <option value="9">9 per row</option>
                    <option value="10">10 per row</option>
                    <option value="11">11 per row</option>
                    <option value="12">12 per row</option>
                </select>
                <div class="multiselect" id="sort-control">
                    <button class="ms-trigger" type="button">sort</button>
                    <div class="ms-panel hidden"></div>
                </div>
            </div>
            <div id="grid" class="card-grid"></div>

            <div id="seek-modal" class="modal hidden">
                <div class="modal-backdrop" id="seek-backdrop"></div>
                <div class="modal-card">
                    <button class="modal-close" id="seek-close" aria-label="Close">&times;</button>
                    <div class="add-section">
                        <h2>I'm looking for the following cards...</h2>
                        <p class="hint">If using CubeCobra: filter 'status:"not owned"', Export, Card Versions (.txt), copy-paste content here</p>
                        <textarea id="card-list" placeholder="One card per line, e.g.&#10;Lightning Bolt&#10;2 Counterspell&#10;Faerie Guidemother (ELD) 11"></textarea>
                        <input id="card-note" type="text" placeholder="Note for these cards (optional, max 50 characters) e.g. English, M15 frame" maxlength="50" />
                        <div id="note-counter">0/50</div>
                        <h3>I'm going to these occasions...</h3>
                        <div id="add-occasions-picker"></div>
                        <button id="add-btn">Add cards</button>
                        <div id="add-progress"></div>
                        <div id="add-results"></div>
                    </div>
                </div>
            </div>

            <div id="occasions-modal" class="modal hidden">
                <div class="modal-backdrop" id="occasions-backdrop"></div>
                <div class="modal-card">
                    <button class="modal-close" id="occasions-close" aria-label="Close">&times;</button>
                    <div class="add-section">
                        <h2>My occasions</h2>
                        <div id="my-occasions-picker"></div>
                        <button id="my-occasions-save">Save</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="toast" class="toast hidden"></div>

        <script>
            let currentUser = null;
            let allEntries = [];
            let entriesById = {};
            let allOccasions = [];
            let myOccasionIDs = new Set();
            const occasionSelected = new Set();
            const occasionPastByName = {};

            const PLACEHOLDER =
                "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='280'><rect width='100%25' height='100%25' fill='%230f1629'/><text x='50%25' y='50%25' fill='%23888' font-family='sans-serif' font-size='14' text-anchor='middle' dominant-baseline='middle'>no image</text></svg>";

            const TRASH_ICON = `<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='3 6 5 6 21 6'/><path d='M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'/><path d='M10 11v6'/><path d='M14 11v6'/><path d='M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2'/></svg>`;

            const $ = (id) => document.getElementById(id);
            const screenA = $("screen-a");
            const screenB = $("screen-b");
            const nameInput = $("name-input");
            const continueBtn = $("continue-btn");
            const cardFilter = $("card-filter");
            const colorFilter = $("color-filter");
            const typeFilter = $("type-filter");
            const giverFilter = $("giver-filter");
            const seekerFilter = $("seeker-filter");
            const hideGiver = $("hide-giver");
            const grid = $("grid");
            const cardList = $("card-list");
            const cardNote = $("card-note");
            const noteCounter = $("note-counter");
            const addBtn = $("add-btn");
            const addProgress = $("add-progress");
            const addResults = $("add-results");
            const toastEl = $("toast");
            const seekBtn = $("seek-btn");
            const seekModal = $("seek-modal");
            const seekBackdrop = $("seek-backdrop");
            const seekClose = $("seek-close");
            const myOccasionsBtn = $("my-occasions-btn");
            const occasionsModal = $("occasions-modal");
            const occasionsBackdrop = $("occasions-backdrop");
            const occasionsClose = $("occasions-close");
            const myOccasionsSave = $("my-occasions-save");
            const occasionFilter = $("occasion-filter");
            const sortControl = $("sort-control");
            const cardsPerRowSel = $("cards-per-row");

            function escapeHtml(s) {
                return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
            }

            function sleep(ms) {
                return new Promise((r) => setTimeout(r, ms));
            }

            let toastTimer;
            function toast(msg) {
                toastEl.textContent = msg;
                toastEl.classList.remove("hidden");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.add("hidden"), 3000);
            }

            // Cards-per-row + pinch-to-zoom share one state: cardsPerRow is
            // "auto" (auto-fill by --card-min, the pre-existing pinch behavior)
            // or an integer 2..12 (fixed column count). Both persist.
            const CARDS_PER_ROW_KEY = "cardsPerRow";
            const CARDS_PER_ROW_MIN = 2;
            const CARDS_PER_ROW_MAX = 12;
            const CARDS_PER_ROW_AUTO = "auto";

            const CARD_MIN_DEFAULT = 200;
            const CARD_MIN_MIN = 80;
            const CARD_MIN_MAX = 400;
            const CARD_MIN_KEY = "cardMin";

            let cardsPerRow = CARDS_PER_ROW_AUTO;
            try {
                const raw = localStorage.getItem(CARDS_PER_ROW_KEY);
                if (raw !== null && raw !== CARDS_PER_ROW_AUTO) {
                    const n = parseInt(raw, 10);
                    if (!isNaN(n) && n >= CARDS_PER_ROW_MIN && n <= CARDS_PER_ROW_MAX) cardsPerRow = n;
                }
            } catch (e) {}

            let cardMin = CARD_MIN_DEFAULT;
            try {
                const saved = parseFloat(localStorage.getItem(CARD_MIN_KEY));
                if (!isNaN(saved) && saved > 0) cardMin = Math.min(CARD_MIN_MAX, Math.max(CARD_MIN_MIN, saved));
            } catch (e) {}

            function persistCardsPerRow() {
                try { localStorage.setItem(CARDS_PER_ROW_KEY, String(cardsPerRow)); } catch (e) {}
            }

            function applyGridSizing() {
                if (cardsPerRow === CARDS_PER_ROW_AUTO) {
                    grid.classList.remove("fixed-cols");
                    grid.style.setProperty("--card-min", cardMin + "px");
                } else {
                    grid.classList.add("fixed-cols");
                    grid.style.setProperty("--cols", String(cardsPerRow));
                }
            }

            let pinchStartDist = 0;
            let pinchStartCardMin = 0;
            let pinchStartCardsPerRow = 0;

            function touchDist(t1, t2) {
                return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
            }

            function pinchEnd() {
                if (!pinchStartDist) return;
                pinchStartDist = 0;
                try {
                    if (cardsPerRow === CARDS_PER_ROW_AUTO) localStorage.setItem(CARD_MIN_KEY, String(cardMin));
                    else persistCardsPerRow();
                } catch (e) {}
            }

            grid.addEventListener("touchstart", (e) => {
                if (e.touches.length === 2) {
                    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
                    pinchStartCardMin = cardMin;
                    pinchStartCardsPerRow = cardsPerRow === CARDS_PER_ROW_AUTO ? 0 : cardsPerRow;
                }
            });

            grid.addEventListener("touchmove", (e) => {
                if (e.touches.length !== 2 || !pinchStartDist) return;
                e.preventDefault();
                const dist = touchDist(e.touches[0], e.touches[1]);
                if (cardsPerRow === CARDS_PER_ROW_AUTO) {
                    cardMin = Math.min(CARD_MIN_MAX, Math.max(CARD_MIN_MIN, (pinchStartCardMin * dist) / pinchStartDist));
                } else {
                    const n = Math.min(CARDS_PER_ROW_MAX, Math.max(CARDS_PER_ROW_MIN, Math.round((pinchStartCardsPerRow * pinchStartDist) / dist)));
                    cardsPerRow = n;
                    cardsPerRowSel.value = String(n);
                }
                applyGridSizing();
            }, { passive: false });

            grid.addEventListener("touchend", pinchEnd);
            grid.addEventListener("touchcancel", pinchEnd);

            cardsPerRowSel.value = String(cardsPerRow);
            cardsPerRowSel.addEventListener("change", () => {
                const v = cardsPerRowSel.value;
                cardsPerRow = v === CARDS_PER_ROW_AUTO ? CARDS_PER_ROW_AUTO : parseInt(v, 10);
                persistCardsPerRow();
                applyGridSizing();
            });

            applyGridSizing();

            // Scryfall rate-limits /cards/collection (metadata) to 2/sec (500ms).
            // /cards/collection returns image_uris.normal — a direct cards.scryfall.io
            // URL which has NO rate limit, so we store it in the DB and use <img src>
            // directly. This queue only paces the few metadata batch requests.
            const SCRYFALL_GAP = 500;
            const scryfallQueue = [];
            let scryfallLastStart = 0;
            let scryfallPumpPending = false;

            function scryfallPump() {
                scryfallPumpPending = false;
                if (!scryfallQueue.length) return;
                const wait = Math.max(0, SCRYFALL_GAP - (Date.now() - scryfallLastStart));
                if (wait > 0) {
                    scryfallPumpPending = true;
                    setTimeout(scryfallPump, wait);
                    return;
                }
                const job = scryfallQueue.shift();
                scryfallLastStart = Date.now();
                fetch(job.url, job.opts).then(job.resolve, job.reject);
                if (scryfallQueue.length) {
                    scryfallPumpPending = true;
                    setTimeout(scryfallPump, SCRYFALL_GAP);
                }
            }

            function scryfallFetch(url, opts) {
                return new Promise((resolve, reject) => {
                    scryfallQueue.push({ url, opts, resolve, reject });
                    if (!scryfallPumpPending) scryfallPump();
                });
            }

            window.imgFallback = function (img) {
                img.onerror = null;
                img.src = PLACEHOLDER;
            };

            // Scryfall requires exact= (not fuzzy=) when a set is specified.
            function scryfallQuery(name, set) {
                return set ? `exact=${encodeURIComponent(name)}&set=${encodeURIComponent(set)}` : `fuzzy=${encodeURIComponent(name)}`;
            }

            // /cards/collection rejects split/transform names ("Status // Statue") and
            // only resolves the front face; /cards/named accepts the full name. Strip
            // here so the batch endpoint finds split/transform cards.
            function frontFaceName(name) {
                return name.split("//")[0].trim();
            }

            function imageURL(name, set) {
                return `https://api.scryfall.com/cards/named?${scryfallQuery(name, set)}&format=image&version=normal`;
            }

            // Scryfall's /cards/collection accepts up to 75 identifiers per POST and
            // returns {data:[...cards], not_found:[...identifiers]}. Batching turns N
            // requests into N/75 (270 cards -> 4 requests), staying under the 2/s limit.
            function pairKey(p) {
                return p.name + "|" + p.set + "|" + (p.collector_number || "");
            }

            function idKey(id) {
                return (id.name || "").toLowerCase() + "\u0000" + (id.set || "").toLowerCase() + "\u0000" + (id.collector_number || "").toLowerCase();
            }

            async function postCollection(identifiers, depth = 0) {
                return scryfallFetch("https://api.scryfall.com/cards/collection", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ identifiers }),
                });
            }

            async function fetchMetadataBatch(chunk) {
                const out = new Map();
                const identifiers = chunk.map((p) => {
                    const id = {};
                    if (p.set && p.collector_number) {
                        id.set = p.set;
                        id.collector_number = p.collector_number;
                    } else {
                        id.name = frontFaceName(p.name);
                        if (p.set) id.set = p.set;
                    }
                    return id;
                });

                let res;
                try {
                    res = await postCollection(identifiers);
                } catch (e) {
                    await sleep(500);
                    try {
                        res = await postCollection(identifiers);
                    } catch (e2) {
                        for (const p of chunk) out.set(pairKey(p), { error: "network error" });
                        return out;
                    }
                }

                if (res.status === 429 && depth < 2) {
                    const retry = parseInt(res.headers.get("Retry-After") || "1", 10);
                    await sleep(Math.max(retry, 1) * 1000);
                    return fetchMetadataBatch(chunk, depth + 1);
                }
                if (!res.ok) {
                    const msg = res.status === 404 ? "card not found" : "Scryfall error";
                    for (const p of chunk) out.set(pairKey(p), { error: msg });
                    return out;
                }

                const data = await res.json();
                const notFoundKeys = new Set();
                for (const nf of data.not_found || []) notFoundKeys.add(idKey(nf));

                const cards = data.data || [];
                let cardIdx = 0;
                for (let j = 0; j < chunk.length; j++) {
                    const p = chunk[j];
                    const k = idKey(identifiers[j]);
                    if (notFoundKeys.has(k)) {
                        out.set(pairKey(p), { error: p.set ? "card or set not found" : "card not found" });
                        notFoundKeys.delete(k);
                        continue;
                    }
                    const card = cards[cardIdx++];
                    if (p.set && typeof card.set === "string" && card.set.toUpperCase() !== p.set.toUpperCase()) {
                        out.set(pairKey(p), { error: "set not found" });
                    } else {
                        const img = card.image_uris || (card.card_faces && card.card_faces[0] && card.card_faces[0].image_uris) || {};
                        out.set(pairKey(p), {
                            colors: (card.colors || []).join(""),
                            type_line: card.type_line || "",
                            mana_value: typeof card.cmc === "number" ? card.cmc : 0,
                            image_url: img.normal || "",
                        });
                    }
                }
                return out;
            }

            function showScreenA() {
                screenA.classList.remove("hidden");
                screenB.classList.add("hidden");
                nameInput.value = "";
                nameInput.focus();
            }

            function showScreenB() {
                screenA.classList.add("hidden");
                screenB.classList.remove("hidden");
            }

            // Screen A: when the URL carries ?occasion= params, show a
            // confirmation block so a new user joins those occasions on submit.
            // Existing users keep the occasions they already saved.
            async function maybeShowOccasionConfirm() {
                const box = $("occasion-confirm");
                const list = $("occasion-confirm-list");
                box.classList.add("hidden");
                list.innerHTML = "";
                const wanted = new URLSearchParams(location.search).getAll("occasion").filter(Boolean);
                if (!wanted.length) return;
                try {
                    await fetchAllOccasions();
                } catch (e) {
                    return;
                }
                const known = allOccasions.filter((o) => wanted.includes(o.name));
                if (!known.length) return;
                box.classList.remove("hidden");
                list.innerHTML = known
                    .map((o) => `<label><input type="checkbox" data-occ-id="${o.id}" checked /><span>${escapeHtml(occasionLabel(o))}</span></label>`)
                    .join("");
            }

            continueBtn.onclick = async () => {
                const name = nameInput.value.trim();
                if (!name) return;
                currentUser = name;
                const p = new URLSearchParams(location.search);
                p.set("user", currentUser);
                history.replaceState(null, "", "?" + p.toString());
                let mine = [];
                try {
                    const res = await fetch(`/api/occasions/mine?user=${encodeURIComponent(currentUser)}`);
                    if (res.ok) mine = (await res.json()).occasions || [];
                } catch (e) {}
                if (mine.length) {
                    myOccasionIDs = new Set(mine.map((o) => o.id));
                } else {
                    const checked = [...document.querySelectorAll("#occasion-confirm-list input:checked")].map((cb) => parseInt(cb.dataset.occId, 10));
                    if (checked.length) {
                        try {
                            const res = await fetch(`/api/occasions/mine?user=${encodeURIComponent(currentUser)}`, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({ occasion_ids: checked }),
                            });
                            if (res.ok) myOccasionIDs = new Set(checked);
                        } catch (e) {}
                    }
                }
                showScreenB();
                parseOccasionsFromURL();
                await loadOccasions();
                loadEntries();
            };

            nameInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") continueBtn.click();
            });
            nameInput.addEventListener("input", () => {
                continueBtn.disabled = !nameInput.value.trim();
            });

            // Add-cards modal: an occasion picker sits between the textarea and the Add cards button.
            // The seeker must have at least one occasion checked to add cards;
            // occasions are saved to the seeker before the entries are posted.
            let addPickerSelected = new Set();
            function updateAddBtn() {
                addBtn.disabled = !(addPickerSelected.size > 0 && cardList.value.trim());
            }
            // Notes are limited to 50 runes server-side (Go []rune). JS
            // string.length counts UTF-16 units, so emoji would be
            // over-counted. Count code points instead to match the server.
            function runeLen(s) {
                return [...s].length;
            }
            function truncateRunes(s, n) {
                return [...s].slice(0, n).join("");
            }
            function updateNoteCounter() {
                if (runeLen(cardNote.value) > 50) {
                    cardNote.value = truncateRunes(cardNote.value, 50);
                }
                noteCounter.textContent = runeLen(cardNote.value) + "/50";
            }
            seekBtn.onclick = () => {
                addPickerSelected = new Set(myOccasionIDs);
                renderOccasionPicker($("add-occasions-picker"), addPickerSelected, { allowCreate: true }, updateAddBtn);
                updateAddBtn();
                updateNoteCounter();
                seekModal.classList.remove("hidden");
                cardList.focus();
            };
            seekClose.onclick = closeSeekModal;
            seekBackdrop.onclick = closeSeekModal;
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    if (!seekModal.classList.contains("hidden")) closeSeekModal();
                    if (!occasionsModal.classList.contains("hidden")) closeOccasionsModal();
                }
            });
            function closeSeekModal() {
                seekModal.classList.add("hidden");
            }
            cardFilter.addEventListener("input", applyFiltersAndRender);
            cardList.addEventListener("input", updateAddBtn);
            cardNote.addEventListener("input", updateNoteCounter);
            cardNote.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !addBtn.disabled) {
                    e.preventDefault();
                    addCards();
                }
            });
            colorFilter.addEventListener("change", applyFiltersAndRender);
            typeFilter.addEventListener("change", applyFiltersAndRender);
            hideGiver.addEventListener("change", applyFiltersAndRender);

            // Multiselect dropdowns for seeker / giver name filters. Each panel
            // lists one checkbox per name gathered from allEntries; an empty
            // selection means "all" (no filter applied).
            const giverSelected = new Set();
            const seekerSelected = new Set();

            function closeAllPanels() {
                document.querySelectorAll(".ms-panel:not(.hidden)").forEach((p) => p.classList.add("hidden"));
                document.querySelectorAll(".ms-trigger.open").forEach((t) => t.classList.remove("open"));
            }

            function setupMultiselect(root, selected, allLabel, countLabel, onChange) {
                const trigger = root.querySelector(".ms-trigger");
                const panel = root.querySelector(".ms-panel");
                trigger.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const willOpen = panel.classList.contains("hidden");
                    closeAllPanels();
                    if (willOpen) {
                        panel.classList.remove("hidden");
                        trigger.classList.add("open");
                    }
                });
                panel.addEventListener("click", (e) => e.stopPropagation());
                function updateTrigger() {
                    trigger.textContent = selected.size ? `${countLabel} (${selected.size})` : allLabel;
                }
                function populate(names) {
                    // Arrays keep their order (used by the occasion filter to
                    // show past occasions last); Sets are sorted A-Z.
                    const list = Array.isArray(names) ? [...names] : [...names].sort((a, b) => a.localeCompare(b));
                    const known = new Set(list);
                    for (const name of [...selected]) {
                        if (!known.has(name)) selected.delete(name);
                    }
                    if (!list.length) {
                        panel.classList.add("empty");
                        panel.innerHTML = "no names yet";
                        updateTrigger();
                        return;
                    }
                    panel.classList.remove("empty");
                    panel.innerHTML = list
                        .map((name) => `<label><input type="checkbox" value="${escapeHtml(name)}" ${selected.has(name) ? "checked" : ""} /><span>${escapeHtml(name)}</span></label>`)
                        .join("");
                    panel.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
                        cb.addEventListener("change", () => {
                            if (cb.checked) selected.add(cb.value);
                            else selected.delete(cb.value);
                            updateTrigger();
                            (onChange || applyFiltersAndRender)();
                        });
                    });
                    updateTrigger();
                }
                return { populate };
            }

            const giverMS = setupMultiselect(giverFilter, giverSelected, "all givers", "givers");
            const seekerMS = setupMultiselect(seekerFilter, seekerSelected, "all seekers", "seekers");

            document.addEventListener("click", closeAllPanels);

            // Occasions: tied to seekers (not entries); entries inherit their
            // seeker's occasions. Filtered client-side by occasion name, synced
            // to the URL as repeated ?occasion=<name> params.
            const occasionMS = setupMultiselect(occasionFilter, occasionSelected, "all occasions", "occasions", () => {
                syncOccasionURL();
                applyFiltersAndRender();
            });

            function rebuildPastMap() {
                for (const k of Object.keys(occasionPastByName)) delete occasionPastByName[k];
                for (const o of allOccasions) occasionPastByName[o.name] = o.past;
            }

            async function fetchAllOccasions() {
                const res = await fetch("/api/occasions?include_past=true");
                if (!res.ok) throw new Error("failed");
                const data = await res.json();
                allOccasions = (data.occasions || []).sort((a, b) => a.name.localeCompare(b.name));
                rebuildPastMap();
            }

            async function fetchMyOccasions() {
                const res = await fetch(`/api/occasions/mine?user=${encodeURIComponent(currentUser)}`);
                if (!res.ok) throw new Error("failed");
                const data = await res.json();
                myOccasionIDs = new Set((data.occasions || []).map((o) => o.id));
            }

            async function loadOccasions() {
                try {
                    await fetchAllOccasions();
                } catch (e) {
                    toast("Network error — try Refresh.");
                    return;
                }
                if (currentUser) {
                    try {
                        await fetchMyOccasions();
                    } catch (e) {}
                } else {
                    myOccasionIDs = new Set();
                }
                populateOccasionFilter();
            }

            function populateOccasionFilter() {
                const known = new Set(allOccasions.map((o) => o.name));
                const fresh = allOccasions.filter((o) => !o.past).map((o) => o.name);
                const pastSel = allOccasions.filter((o) => o.past && occasionSelected.has(o.name)).map((o) => o.name);
                // Unknown names (e.g. a typo in a shared link) stay visible so
                // they can be un-checked instead of silently vanishing.
                const unknownSel = [...occasionSelected].filter((n) => !known.has(n)).sort((a, b) => a.localeCompare(b));
                occasionMS.populate([...fresh, ...pastSel, ...unknownSel]);
            }

            function parseOccasionsFromURL() {
                occasionSelected.clear();
                for (const name of new URLSearchParams(location.search).getAll("occasion")) {
                    if (name) occasionSelected.add(name);
                }
            }

            function syncOccasionURL() {
                const prev = new URLSearchParams(location.search);
                const next = new URLSearchParams();
                const user = prev.get("user");
                if (user) next.set("user", user);
                for (const name of occasionSelected) next.append("occasion", name);
                const qs = next.toString();
                history.replaceState(null, "", qs ? "?" + qs : location.pathname);
            }

            function occasionLabel(o) {
                const when = o.date_or_recurring === "recurring" ? "recurring" : o.date_or_recurring;
                return `${o.name} · ${when}`;
            }

            // Shared occasion checkbox list + "+ New occasion" sub-form.
            // selected is a live Set of occasion ids; onChange fires on
            // check/uncheck and after creating an occasion.
            let occPickerSeq = 0;
            function renderOccasionPicker(container, selected, opts, onChange) {
                const allowCreate = !opts || opts.allowCreate !== false;
                const radioName = "occ-type-" + ++occPickerSeq;
                const visible = allOccasions.filter((o) => !o.past || selected.has(o.id));
                container.innerHTML = `
                    <div class="occ-list">${visible.map((o) => `<label><input type="checkbox" data-occ-id="${o.id}" ${selected.has(o.id) ? "checked" : ""} /><span>${escapeHtml(occasionLabel(o))}</span></label>`).join("") || "no occasions yet"}</div>
                    ${allowCreate ? `<button type="button" class="occ-new-toggle">+ New occasion</button>
                    <div class="occ-new-form hidden">
                        <input class="occ-name" type="text" placeholder="Occasion name" />
                        <label><input type="radio" name="${radioName}" value="recurring" checked /> Recurring</label>
                        <label><input type="radio" name="${radioName}" value="onetime" /> One-time</label>
                        <input class="occ-date hidden" type="date" />
                        <button type="button" class="occ-create">Create</button>
                    </div>` : ""}`;
                container.querySelectorAll(".occ-list input[type=checkbox]").forEach((cb) => {
                    cb.addEventListener("change", () => {
                        const id = parseInt(cb.dataset.occId, 10);
                        if (cb.checked) selected.add(id);
                        else selected.delete(id);
                        if (onChange) onChange();
                    });
                });
                if (!allowCreate) return selected;
                const toggle = container.querySelector(".occ-new-toggle");
                const form = container.querySelector(".occ-new-form");
                const dateInput = container.querySelector(".occ-date");
                toggle.addEventListener("click", () => form.classList.toggle("hidden"));
                container.querySelectorAll(`input[name="${radioName}"]`).forEach((r) => {
                    r.addEventListener("change", () => {
                        dateInput.classList.toggle("hidden", container.querySelector(`input[name="${radioName}"]:checked`).value !== "onetime");
                    });
                });
                container.querySelector(".occ-create").addEventListener("click", async () => {
                    const name = container.querySelector(".occ-name").value.trim();
                    const oneTime = container.querySelector(`input[name="${radioName}"]:checked`).value === "onetime";
                    const dateOrRecurring = oneTime ? dateInput.value : "recurring";
                    if (!name || !dateOrRecurring) {
                        toast("Name and date are required.");
                        return;
                    }
                    try {
                        const res = await fetch(`/api/occasions?user=${encodeURIComponent(currentUser)}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ name, date_or_recurring: dateOrRecurring }),
                        });
                        const data = await res.json().catch(() => ({}));
                        if (res.status === 409) {
                            toast("That occasion already exists.");
                            return;
                        }
                        if (!res.ok) {
                            toast(data.error || "Failed to create occasion.");
                            return;
                        }
                        allOccasions.push(data);
                        allOccasions.sort((a, b) => a.name.localeCompare(b.name));
                        rebuildPastMap();
                        selected.add(data.id);
                        renderOccasionPicker(container, selected, opts, onChange);
                        populateOccasionFilter();
                        if (onChange) onChange();
                    } catch (e) {
                        toast("Network error — try Refresh.");
                    }
                });
                return selected;
            }

            // "My occasions" modal.
            let myPickerSelected = new Set();
            function updateMySaveBtn() {
                myOccasionsSave.disabled = myPickerSelected.size === 0;
            }
            myOccasionsBtn.onclick = () => {
                myPickerSelected = new Set(myOccasionIDs);
                renderOccasionPicker($("my-occasions-picker"), myPickerSelected, { allowCreate: true }, updateMySaveBtn);
                updateMySaveBtn();
                occasionsModal.classList.remove("hidden");
            };
            occasionsClose.onclick = closeOccasionsModal;
            occasionsBackdrop.onclick = closeOccasionsModal;
            function closeOccasionsModal() {
                occasionsModal.classList.add("hidden");
            }
            myOccasionsSave.onclick = async () => {
                try {
                    const res = await fetch(`/api/occasions/mine?user=${encodeURIComponent(currentUser)}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ occasion_ids: [...myPickerSelected] }),
                    });
                    if (!res.ok) {
                        const data = await res.json().catch(() => ({}));
                        toast(data.error || "Failed to save occasions.");
                        return;
                    }
                    myOccasionIDs = new Set(myPickerSelected);
                    toast("Saved.");
                    loadEntries();
                } catch (e) {
                    toast("Network error — try Refresh.");
                }
            };

            async function loadEntries() {
                try {
                    const url = currentUser ? `/api/entries?user=${encodeURIComponent(currentUser)}` : "/api/entries";
                    const res = await fetch(url);
                    if (!res.ok) throw new Error("failed");
                    const data = await res.json();
                    allEntries = data.entries || [];
                    populateNameFilters();
                    applyFiltersAndRender();
                    backfillMetadata();
                } catch (e) {
                    toast("Network error — try Refresh.");
                }
            }

            function populateNameFilters() {
                const givers = new Set();
                const seekers = new Set();
                for (const e of allEntries) {
                    if (e.giver) givers.add(e.giver);
                    seekers.add(e.seeker);
                }
                giverMS.populate(givers);
                seekerMS.populate(seekers);
            }

            // Backfill image_url and mana_value for legacy cards that lack
            // either (image_url empty or mana_value null). Both come from the
            // same Scryfall /cards/collection call, so we fetch once per card.
            async function backfillMetadata() {
                const missing = new Map();
                for (const e of allEntries) {
                    if (!e.card.image_url || e.card.mana_value == null) {
                        const k = pairKey(e.card);
                        if (!missing.has(k)) missing.set(k, { name: e.card.name, set: e.card.set, collector_number: e.card.collector_number });
                    }
                }
                if (!missing.size) return;
                const pairs = [...missing.values()];
                const meta = new Map();
                const BATCH = 75;
                for (let b = 0; b < Math.ceil(pairs.length / BATCH); b++) {
                    const chunk = pairs.slice(b * BATCH, (b + 1) * BATCH);
                    const part = await fetchMetadataBatch(chunk);
                    for (const [k, v] of part) meta.set(k, v);
                }
                const updates = [];
                for (const [k, p] of missing) {
                    const m = meta.get(k);
                    if (m && !m.error && (m.image_url || m.mana_value != null)) {
                        updates.push({ name: p.name, set: p.set, collector_number: p.collector_number, image_url: m.image_url || "", mana_value: m.mana_value });
                    }
                }
                if (!updates.length) return;
                try {
                    await fetch("/api/cards/metadata", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ cards: updates }),
                    });
                    for (const u of updates) {
                        const k = pairKey(u);
                        for (const e of allEntries) {
                            if (pairKey(e.card) === k) {
                                if (u.image_url) e.card.image_url = u.image_url;
                                if (u.mana_value != null) e.card.mana_value = u.mana_value;
                            }
                        }
                    }
                    applyFiltersAndRender();
                } catch (e) {}
            }

            function colorGroup(colors) {
                if (!colors) return "colorless";
                if (colors.length === 1) return colors;
                return "multicolor";
            }

            const TYPE_ORDER = { planeswalker: 0, creature: 1, artifact: 2, enchantment: 3, instant: 4, sorcery: 5, land: 6, battle: 7 };
            const SUPERTYPES = new Set(["legendary", "basic", "snow", "world", "elite", "ongoing"]);

            function typeGroup(typeLine) {
                if (!typeLine) return 8;
                let left = typeLine;
                const i = typeLine.indexOf(" — ");
                if (i >= 0) left = typeLine.slice(0, i);
                let first = 8;
                for (const token of left.split(" ")) {
                    const key = token.toLowerCase();
                    if (SUPERTYPES.has(key)) continue;
                    if (!(key in TYPE_ORDER)) continue;
                    if (key === "creature") return TYPE_ORDER[key];
                    if (first === 8) first = TYPE_ORDER[key];
                }
                return first;
            }

            // Sort control: far-right dropdown listing the 5 sort criteria in
            // priority order (first = primary). Arrow buttons move a criterion
            // up/down; all directions are fixed ascending. Client-side only —
            // the server order stays the default. Preference persists per
            // device in localStorage.
            const SORT_KEYS = ["color", "type", "mana", "name", "added"];
            const SORT_LABELS = { color: "Color", type: "Type", mana: "Mana value", name: "Name", added: "Seeking since" };
            const SORT_DEFAULT = ["color", "type", "mana", "name", "added"];
            const SORT_KEY = "sortOrder";

            let sortOrder = [...SORT_DEFAULT];
            try {
                const raw = localStorage.getItem(SORT_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length === SORT_KEYS.length && SORT_KEYS.every((k) => parsed.includes(k)) && new Set(parsed).size === SORT_KEYS.length) {
                        sortOrder = parsed;
                    }
                }
            } catch (e) {}

            function persistSortOrder() {
                try { localStorage.setItem(SORT_KEY, JSON.stringify(sortOrder)); } catch (e) {}
            }

            // Mirrors server ColorSortKey: ""->5, W0 U1 B2 R3 G4, other single->5, multi->6.
            function colorOrder(colors) {
                if (!colors) return 5;
                if (colors.length > 1) return 6;
                switch (colors) {
                    case "W": return 0;
                    case "U": return 1;
                    case "B": return 2;
                    case "R": return 3;
                    case "G": return 4;
                    default: return 5;
                }
            }

            function manaOrder(v) {
                return v == null ? -1 : v;
            }

            function addedCompare(a, b) {
                if (a.created_at < b.created_at) return -1;
                if (a.created_at > b.created_at) return 1;
                return a.id - b.id;
            }

            const SORT_CMPS = {
                color: (a, b) => colorOrder(a.card.colors) - colorOrder(b.card.colors),
                type: (a, b) => typeGroup(a.card.type_line) - typeGroup(b.card.type_line),
                mana: (a, b) => manaOrder(a.card.mana_value) - manaOrder(b.card.mana_value),
                name: (a, b) => a.card.name.localeCompare(b.card.name),
                added: addedCompare,
            };

            function compareBySortOrder(a, b) {
                for (const key of sortOrder) {
                    const cmp = SORT_CMPS[key](a, b);
                    if (cmp !== 0) return cmp;
                }
                return 0;
            }

            function renderSortPanel() {
                const panel = sortControl.querySelector(".ms-panel");
                panel.innerHTML = `<ul class="sort-list">${sortOrder.map((key, i) => `<li class="sort-item"><span class="sort-label">${SORT_LABELS[key]}</span><button type="button" class="sort-move" data-move="up" data-idx="${i}" ${i === 0 ? "disabled" : ""} aria-label="Move ${SORT_LABELS[key]} up">▲</button><button type="button" class="sort-move" data-move="down" data-idx="${i}" ${i === sortOrder.length - 1 ? "disabled" : ""} aria-label="Move ${SORT_LABELS[key]} down">▼</button></li>`).join("")}</ul>`;
                panel.querySelectorAll("button.sort-move").forEach((btn) => {
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        const idx = parseInt(btn.dataset.idx, 10);
                        const dir = btn.dataset.move === "up" ? -1 : 1;
                        const j = idx + dir;
                        if (j < 0 || j >= sortOrder.length) return;
                        const tmp = sortOrder[idx];
                        sortOrder[idx] = sortOrder[j];
                        sortOrder[j] = tmp;
                        persistSortOrder();
                        renderSortPanel();
                        applyFiltersAndRender();
                    });
                });
            }

            function setupSortControl() {
                const trigger = sortControl.querySelector(".ms-trigger");
                const panel = sortControl.querySelector(".ms-panel");
                trigger.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const willOpen = panel.classList.contains("hidden");
                    closeAllPanels();
                    if (willOpen) {
                        renderSortPanel();
                        panel.classList.remove("hidden");
                        trigger.classList.add("open");
                    }
                });
                panel.addEventListener("click", (e) => e.stopPropagation());
            }

            setupSortControl();

            function applyFiltersAndRender() {
                const cardF = cardFilter.value.trim().toLowerCase();
                const colorF = colorFilter.value;
                const typeF = typeFilter.value;
                const hide = hideGiver.checked;
                let myOccasionNames = null;
                if (!occasionSelected.size && myOccasionIDs.size) {
                    myOccasionNames = new Set();
                    for (const o of allOccasions) if (myOccasionIDs.has(o.id)) myOccasionNames.add(o.name);
                }
                const filtered = allEntries.filter((e) => {
                    if (cardF && !e.card.name.toLowerCase().includes(cardF)) return false;
                    if (colorF && colorGroup(e.card.colors) !== colorF) return false;
                    if (typeF && String(typeGroup(e.card.type_line)) !== typeF) return false;
                    if (seekerSelected.size && !seekerSelected.has(e.seeker)) return false;
                    if (giverSelected.size && !giverSelected.has(e.giver)) return false;
                    if (hide && e.giver !== "") return false;
                    const entryOccasions = e.occasions || [];
                    if (occasionSelected.size) {
                        if (!entryOccasions.some((n) => occasionSelected.has(n))) return false;
                    } else {
                        if (entryOccasions.length && entryOccasions.every((n) => occasionPastByName[n])) return false;
                        if (myOccasionNames && entryOccasions.length && !entryOccasions.some((n) => myOccasionNames.has(n))) return false;
                    }
                    return true;
                });
                filtered.sort(compareBySortOrder);
                render(filtered);
            }

            function render(entries) {
                entriesById = {};
                for (const e of entries) entriesById[e.id] = e;
                grid.innerHTML = entries.map(tileHTML).join("");
            }

            function tileHTML(e) {
                const clickable = e.giver === "" || e.giver === currentUser;
                const claimed = e.giver && e.giver !== currentUser;
                const imgAction = clickable ? "data-action='toggle-giver'" : "";

                let actions = "";
                if (e.seeker !== currentUser && (e.giver === "" || e.giver === currentUser)) {
                    actions += `<button data-action='toggle-giver'>${e.giver === currentUser ? "Ungive" : "Give"}</button>`;
                }

                const cancelBtn = e.seeker === currentUser
                    ? `<button class='tile-icon-btn' data-action='cancel' title='Cancel' aria-label='Cancel'>${TRASH_ICON}</button>`
                    : "";

                return `
                <div class='card-tile${clickable ? " clickable" : ""}${claimed ? " claimed" : ""}' data-id='${e.id}'>
                    <div class='img-wrap'>
                        <img src="${escapeHtml(e.card.image_url || imageURL(e.card.name, e.card.set))}" loading="lazy" alt="${escapeHtml(e.card.name)}" ${imgAction} onerror="imgFallback(this)" />
                        ${claimed ? "<div class='claimed-badge'>claimed</div>" : ""}
                    </div>
                    ${e.note ? `<div class="note">${escapeHtml(e.note)}</div>` : ""}
                    <div class='info${e.giver ? " has-giver" : ""}'>
                        <div class='info-text'>
                            <div class='seeker'>seeker: ${escapeHtml(e.seeker)}</div>
                            ${e.giver ? `<div class='giver'>giver: ${escapeHtml(e.giver)}</div>` : ""}
                            ${actions ? `<div class='actions'>${actions}</div>` : ""}
                        </div>
                        ${cancelBtn}
                    </div>
                </div>`;
            }

            grid.addEventListener("click", (ev) => {
                const actionEl = ev.target.closest("[data-action]");
                if (!actionEl) return;
                const tile = ev.target.closest(".card-tile");
                if (!tile) return;
                const id = parseInt(tile.dataset.id, 10);
                const entry = entriesById[id];
                if (!entry) return;
                const action = actionEl.dataset.action;
                if (action === "toggle-giver") {
                    if (entry.giver === "") postGiver(entry);
                    else if (entry.giver === currentUser) deleteGiver(entry);
                } else if (action === "cancel") {
                    removeEntry(entry);
                }
            });

            async function postGiver(entry) {
                try {
                    const res = await fetch(`/api/entries/${entry.id}/giver?user=${encodeURIComponent(currentUser)}`, { method: "POST" });
                    if (res.status === 409) {
                        const data = await res.json();
                        toast(`Sorry — ${data.entry?.giver || "someone"} is already giving this card.`);
                        loadEntries();
                        return;
                    }
                    if (res.status === 404) {
                        toast("This entry is no longer available.");
                        loadEntries();
                        return;
                    }
                    if (!res.ok) throw new Error("failed");
                    loadEntries();
                } catch (e) {
                    toast("Network error — try Refresh.");
                }
            }

            async function deleteGiver(entry) {
                try {
                    const res = await fetch(`/api/entries/${entry.id}/giver?user=${encodeURIComponent(currentUser)}`, { method: "DELETE" });
                    if (res.status === 404) {
                        toast("This entry is no longer available.");
                        loadEntries();
                        return;
                    }
                    if (!res.ok && res.status !== 204) throw new Error("failed");
                    loadEntries();
                } catch (e) {
                    toast("Network error — try Refresh.");
                }
            }

            async function removeEntry(entry) {
                try {
                    const res = await fetch(`/api/entries/${entry.id}/remove?user=${encodeURIComponent(currentUser)}`, { method: "POST" });
                    if (res.status === 403) {
                        toast("You can only remove your own entries.");
                        return;
                    }
                    if (res.status === 404) {
                        toast("This entry is no longer available.");
                        loadEntries();
                        return;
                    }
                    if (!res.ok && res.status !== 204) throw new Error("failed");
                    loadEntries();
                } catch (e) {
                    toast("Network error — try Refresh.");
                }
            }

            addBtn.onclick = addCards;

            async function addCards() {
                addBtn.disabled = true;
                addProgress.textContent = "";
                addResults.innerHTML = "";
                try {
                    await processAdd();
                } finally {
                    updateAddBtn();
                }
            }

            async function processAdd() {
                if (!addPickerSelected.size) {
                    toast("Select at least one occasion.");
                    return;
                }
                const same = addPickerSelected.size === myOccasionIDs.size && [...addPickerSelected].every((id) => myOccasionIDs.has(id));
                if (!same) {
                    try {
                        const res = await fetch(`/api/occasions/mine?user=${encodeURIComponent(currentUser)}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ occasion_ids: [...addPickerSelected] }),
                        });
                        if (!res.ok) {
                            const data = await res.json().catch(() => ({}));
                            toast(data.error || "Failed to save occasions.");
                            return;
                        }
                        myOccasionIDs = new Set(addPickerSelected);
                    } catch (e) {
                        toast("Network error — try Refresh.");
                        return;
                    }
                }
                const text = cardList.value;
                const rawLines = text.split("\n");
                const units = [];
                const failedLines = new Set();
                const lineErrors = [];

                for (let i = 0; i < rawLines.length; i++) {
                    const line = rawLines[i].trim();
                    if (!line) continue;
                    const m = line.match(/^\s*(\d+)\s*x?\s+(.*)$/);
                    let qty = 1;
                    let rest = line;
                    if (m) {
                        qty = parseInt(m[1], 10);
                        rest = m[2].trim();
                    }
                    const parsed = rest.match(/^(.*?)\s*(?:\((\w+)\)(?:\s+(\S+))?)?$/);
                    const name = (parsed[1] || "").trim();
                    const set = (parsed[2] || "").toUpperCase();
                    const collectorNumber = (parsed[3] || "").trim();
                    if (!name) {
                        failedLines.add(i);
                        lineErrors.push({ line: i, name: "", error: "empty name" });
                        continue;
                    }
                    for (let q = 0; q < qty; q++) units.push({ sourceLine: i, name, set, collector_number: collectorNumber });
                }

                if (units.length === 0) {
                    addResults.innerHTML = "No cards to add.";
                    return;
                }

                const seen = new Map();
                for (const u of units) {
                    const key = pairKey(u);
                    if (!seen.has(key)) seen.set(key, { name: u.name, set: u.set, collector_number: u.collector_number });
                }
                const pairs = [...seen.values()];

                const meta = new Map();
                const BATCH = 75;
                const batches = Math.ceil(pairs.length / BATCH);
                for (let b = 0; b < batches; b++) {
                    const chunk = pairs.slice(b * BATCH, (b + 1) * BATCH);
                    addProgress.textContent = `Resolving ${b + 1}/${batches} (${chunk.length} cards)…`;
                    const part = await fetchMetadataBatch(chunk);
                    for (const [k, v] of part) meta.set(k, v);
                }

                const batchNote = truncateRunes(cardNote.value.trim(), 50);
                const cards = [];
                const cardSources = [];
                for (const u of units) {
                    const m = meta.get(pairKey(u));
                    if (m && m.error) {
                        failedLines.add(u.sourceLine);
                        lineErrors.push({ line: u.sourceLine, name: u.name, error: m.error });
                    } else if (m) {
                        cards.push({ name: u.name, set: u.set, collector_number: u.collector_number, colors: m.colors, type_line: m.type_line, mana_value: m.mana_value, image_url: m.image_url, note: batchNote });
                        cardSources.push(u.sourceLine);
                    }
                }

                let created = 0;
                if (cards.length > 0) {
                    let res;
                    try {
                        res = await fetch(`/api/entries?user=${encodeURIComponent(currentUser)}`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ cards }),
                        });
                    } catch (e) {
                        toast("Network error — try Refresh.");
                        return;
                    }
                    const data = await res.json().catch(() => ({}));
                    if (res.ok) {
                        created = data.created || 0;
                        for (const e of data.errors || []) {
                            const src = cardSources[e.line];
                            if (src !== undefined) {
                                failedLines.add(src);
                                lineErrors.push({ line: src, name: cards[e.line]?.name || "", error: e.error });
                            }
                        }
                    } else {
                        toast(data.error || "Failed to add cards.");
                        return;
                    }
                }

                addProgress.textContent = "";
                let html = `Added ${created} card${created === 1 ? "" : "s"}.`;
                if (lineErrors.length) {
                    html += `<br><span class="err">Failed lines:</span>`;
                    for (const e of lineErrors) {
                        html += `<br><span class="err">• ${escapeHtml(e.name || "(empty)")} — ${escapeHtml(e.error)}</span>`;
                    }
                }
                addResults.innerHTML = html;

                if (failedLines.size > 0) {
                    cardList.value = rawLines.filter((_, i) => failedLines.has(i)).join("\n");
                } else {
                    cardList.value = "";
                    cardNote.value = "";
                    noteCounter.textContent = "0/50";
                }

                loadEntries();
            }

            function syncFromURL() {
                const p = new URLSearchParams(location.search);
                const u = p.get("user") || null;
                parseOccasionsFromURL();
                if (u && !currentUser) {
                    currentUser = u;
                    showScreenB();
                    (async () => {
                        await loadOccasions();
                        loadEntries();
                    })();
                } else if (!u && currentUser) {
                    currentUser = null;
                    myOccasionIDs = new Set();
                    showScreenA();
                    maybeShowOccasionConfirm();
                } else if (u) {
                    populateOccasionFilter();
                    applyFiltersAndRender();
                } else {
                    maybeShowOccasionConfirm();
                }
            }
            window.addEventListener("popstate", syncFromURL);

            const params = new URLSearchParams(location.search);
            currentUser = params.get("user") || null;
            parseOccasionsFromURL();
            if (currentUser) {
                showScreenB();
                (async () => {
                    await loadOccasions();
                    loadEntries();
                })();
            } else {
                showScreenA();
                maybeShowOccasionConfirm();
            }
        </script>
    </body>
</html>
